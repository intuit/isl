[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isl-python"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["lark>=1.1", "python-dateutil>=2.8"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["isl"]
